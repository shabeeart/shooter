<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Mobile Shooter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: sans-serif;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #score {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: lime;
      background: green;
      padding: 10px 20px;
      font-weight: bold;
      font-size: 18px;
      border-radius: 5px;
      z-index: 10;
    }
    #fireButton {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #f0c25e;
      padding: 20px 0;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: white;
      border-top: 2px solid #fff;
      z-index: 10;
    }
    #fireButton span {
      background: orangered;
      padding: 15px 40px;
      border-radius: 30px;
      border: 3px solid white;
      display: inline-block;
    }
    #gameOver {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: white;
      font-size: 30px;
      padding: 30px 50px;
      border: 4px solid red;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div id="score">SCORE: 0</div>
  <canvas id="gameCanvas"></canvas>
  <div id="fireButton"><span>HOLD TO FIRE</span></div>
  <div id="gameOver">GAME OVER</div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let gun = {
      x: canvas.width / 2,
      y: canvas.height - 180,
      width: 60,
      height: 120
    };
    let bullets = [];
    let obstacles = [];
    let score = 0;
    let firing = false;
    let gameOver = false;

    function createObstacle() {
      const radius = Math.random() * 30 + 20;
      obstacles.push({
        x: Math.random() * (canvas.width - radius * 2) + radius,
        y: -radius,
        radius,
        speed: 2 + Math.random() * 2
      });
    }

    function drawGun() {
      if (gameOver) return;
      ctx.fillStyle = "white";
      ctx.beginPath();
      ctx.moveTo(gun.x, gun.y);
      ctx.lineTo(gun.x - 40, gun.y + gun.height);
      ctx.lineTo(gun.x + 40, gun.y + gun.height);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "orange";
      ctx.fillRect(gun.x - 10, gun.y - 35, 20, 35);
      ctx.beginPath();
      ctx.arc(gun.x, gun.y - 35, 12, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBullet(b) {
      ctx.fillStyle = "orange";
      ctx.beginPath();
      ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawObstacle(o) {
      const grad = ctx.createRadialGradient(o.x, o.y, o.radius * 0.3, o.x, o.y, o.radius);
      grad.addColorStop(0, "#ff00ff");
      grad.addColorStop(1, "#8000ff");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function update() {
      if (gameOver) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGun();

      bullets = bullets.filter(b => b.y > -20);
      bullets.forEach(b => {
        b.y -= 12;
        drawBullet(b);
      });

      obstacles.forEach((o, j) => {
        o.y += o.speed;
        drawObstacle(o);

        const dx = gun.x - o.x;
        const dy = (gun.y + gun.height / 2) - o.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < o.radius + 30) {
          document.getElementById("gameOver").style.display = "block";
          gameOver = true;
        }
      });

      bullets.forEach((b, i) => {
        obstacles.forEach((o, j) => {
          const dx = b.x - o.x;
          const dy = b.y - o.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < o.radius) {
            obstacles.splice(j, 1);
            bullets.splice(i, 1);
            score++;
            document.getElementById("score").innerText = "SCORE: " + score;
          }
        });
      });

      if (Math.random() < 0.03) createObstacle();
      requestAnimationFrame(update);
    }

    function shoot() {
      if (!gameOver) {
        bullets.push({ x: gun.x, y: gun.y - 30 });
      }
    }

    document.getElementById("fireButton").addEventListener("touchstart", () => {
      firing = true;
      shoot();
    });
    document.getElementById("fireButton").addEventListener("touchend", () => {
      firing = false;
    });

    setInterval(() => {
      if (firing) shoot();
    }, 150);

    window.addEventListener("deviceorientation", function(e) {
      if (e.gamma !== null) {
        gun.x += e.gamma / 2;
        gun.x = Math.max(40, Math.min(canvas.width - 40, gun.x));
      }
    });

    if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
      DeviceMotionEvent.requestPermission().then(response => {
        if (response !== "granted") {
          alert("Enable motion access in Safari Settings");
        }
      }).catch(console.error);
    }

    update();
  </script>
</body>
</html>
